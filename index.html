<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="광고 없는 오프라인 복싱 인터벌 타이머">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <title>Boxing Timer</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--muted:#a4a8b2;--line:#30333b;--accent:#f04438;--rest:#32b978}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100svh}
    main{max-width:520px;margin:auto;padding:22px 18px calc(24px + env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column;gap:17px}
    header{display:flex;justify-content:space-between;align-items:center}
    h1{font-size:18px;margin:0;letter-spacing:.08em}
    .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:6px 10px}
    .screen{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 18px 22px;text-align:center}
    #phase{font-size:13px;font-weight:800;letter-spacing:.22em;color:var(--muted)}
    #clock{font-size:clamp(76px,22vw,112px);font-weight:850;letter-spacing:-.07em;line-height:1.15;font-variant-numeric:tabular-nums;margin:12px 0 6px}
    #round{font-size:15px;font-weight:700;color:var(--muted)}
    .track{height:8px;background:#343740;border-radius:20px;overflow:hidden;margin-top:24px}
    #progress{height:100%;width:0;background:var(--accent);transition:width .15s linear}
    #message{font-size:13px;color:var(--muted);margin-top:14px;min-height:20px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat,.settings{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
    .small{font-size:12px;color:var(--muted)}
    .value{font-size:22px;font-weight:800;margin:4px 0}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button,select{font:inherit}
    button{border:0;border-radius:15px;padding:16px 12px;font-weight:800;font-size:16px;cursor:pointer}
    button:active{transform:scale(.98)}
    #start{background:var(--accent);color:white}
    #reset{background:#30333b;color:white}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted)}
    select{width:100%;background:#292c33;color:white;border:1px solid #444852;border-radius:10px;padding:10px}
    .toggles{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px}
    .toggle{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px}
    input{accent-color:var(--accent);width:18px;height:18px}
    footer{text-align:center;font-size:11px;color:#858a95;line-height:1.6;margin-top:auto}
    .work #progress{background:var(--accent)} .rest #progress{background:var(--rest)}
    .rest #phase{color:var(--rest)} .work #phase{color:var(--accent)}
    @media(min-height:850px){main{padding-top:34px;gap:20px}.screen{padding:38px 20px 26px}}
  </style>
</head>
<body>
<main id="app" class="work">
  <header><h1>BOXING TIMER</h1><span class="tag">OFFLINE · NO ADS</span></header>
  <section class="screen" aria-live="polite">
    <div id="phase">READY</div>
    <div id="clock">3:00</div>
    <div id="round">ROUND 1</div>
    <div class="track"><div id="progress"></div></div>
    <div id="message">준비되면 시작하세요</div>
  </section>
  <section class="stats">
    <div class="stat"><div class="small">운동</div><div class="value">03:00</div><div class="small">종료 30초 전 알림</div></div>
    <div class="stat"><div class="small">휴식</div><div class="value">00:30</div><div class="small">종료 10초 전 알림</div></div>
  </section>
  <section class="buttons">
    <button id="start">▶ 시작</button><button id="reset">↺ 초기화</button>
  </section>
  <section class="settings">
    <label>라운드 수
      <select id="rounds">
        <option value="0">무제한</option><option>3</option><option>5</option><option selected>10</option><option>12</option><option>15</option>
      </select>
    </label>
    <label>운동 시간
      <select id="workTime"><option value="180" selected>3분</option><option value="120">2분</option><option value="240">4분</option></select>
    </label>
  </section>
  <section class="toggles">
    <label class="toggle"><input type="checkbox" id="sound" checked> 비프음</label>
    <label class="toggle"><input type="checkbox" id="vibration" checked> 진동</label>
    <label class="toggle"><input type="checkbox" id="keep" checked> 화면 켜짐 유지</label>
  </section>
  <footer>운동 종료 30초 전 · 휴식 종료 10초 전 알림<br>첫 실행 후 인터넷 없이 사용할 수 있습니다.</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const app = $('app');
  let phase='ready', round=1, remaining=180, running=false, deadline=0, raf=0, lastCue='';
  let audioCtx=null, wakeLock=null;
  const restTime=30;
  const workSeconds=()=>Number($('workTime').value);
  const maxRounds=()=>Number($('rounds').value);
  const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;

  function beep(freq=880,duration=.18){
    if(!$('sound').checked)return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.2,audioCtx.currentTime+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime+duration+.02);
    }catch(e){}
  }
  function cue(freq=880,duration=.18){
    beep(freq,duration);
    if($('vibration').checked && 'vibrate' in navigator) navigator.vibrate([120,70,120]);
  }
  async function holdScreen(){
    if(!$('keep').checked || !('wakeLock' in navigator)) return;
    try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
  }
  async function releaseScreen(){try{if(wakeLock)await wakeLock.release();}catch(e){} wakeLock=null;}
  function render(){
    $('clock').textContent=fmt(remaining);
    $('phase').textContent=phase==='work'?'BOXING ROUND':phase==='rest'?'REST':'READY';
    $('round').textContent=`ROUND ${round}${maxRounds() ? ' / '+maxRounds() : ''}`;
    const duration=phase==='rest'?restTime:workSeconds();
    $('progress').style.width=`${Math.max(0,Math.min(100,(1-remaining/duration)*100))}%`;
    $('message').textContent=phase==='work'?'집중해서 움직이세요!':phase==='rest'?'호흡을 정리하세요':'준비되면 시작하세요';
    $('start').textContent=running?'Ⅱ 일시정지':phase==='ready'?'▶ 시작':'▶ 계속';
    app.className=phase==='rest'?'rest':'work';
    $('workTime').disabled=running || phase!=='ready';
    $('rounds').disabled=running || phase!=='ready';
  }
  function advance(){
    if(phase==='work'){
      phase='rest'; remaining=restTime; cue(660,.35);
    }else{
      if(maxRounds() && round>=maxRounds()){
        running=false; phase='ready'; remaining=workSeconds(); releaseScreen();
        $('message').textContent='훈련 완료! 수고하셨습니다.';
        beep(1100,.6); render(); return;
      }
      phase='work'; round++; remaining=workSeconds(); cue(990,.35);
    }
    lastCue=''; deadline=performance.now()+remaining*1000;
  }
  function tick(){
    if(!running)return;
    const now=performance.now();
    remaining=Math.max(0,Math.ceil((deadline-now)/1000));
    const key=phase==='work'?'work30':'rest10';
    const target=phase==='work'?30:10;
    if(remaining===target && lastCue!==key){cue();lastCue=key;}
    if(now>=deadline){advance(); if(!running)return;}
    render();
    raf=requestAnimationFrame(tick);
  }
  async function startPause(){
    if(running){
      running=false; cancelAnimationFrame(raf); render(); return;
    }
    if(phase==='ready'){phase='work';round=1;remaining=workSeconds();}
    if(audioCtx && audioCtx.state==='suspended') await audioCtx.resume();
    // Unlock audio from the user's tap before starting the interval.
    if($('sound').checked) beep(700,.08);
    running=true; lastCue=''; deadline=performance.now()+remaining*1000;
    await holdScreen(); render(); raf=requestAnimationFrame(tick);
  }
  $('start').addEventListener('click',startPause);
  $('reset').addEventListener('click',async()=>{
    running=false;cancelAnimationFrame(raf);await releaseScreen();
    phase='ready';round=1;remaining=workSeconds();lastCue='';render();
  });
  $('workTime').addEventListener('change',()=>{remaining=workSeconds();render();});
  $('rounds').addEventListener('change',render);
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible' && running){
      remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));
      await holdScreen();render();
    }
  });
  window.addEventListener('pagehide',()=>{if(wakeLock)releaseScreen();});
  render();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
